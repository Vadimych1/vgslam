[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vgslam"
version = "0.1.0"
description = "A Python package for VGSLAM"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Your Name", email = "your.email@example.com" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "networkx>=3.6.1",
    "numpy>=2.2.0",
    "numba>=0.67.0",
    "small_gicp>=1.0.1",
    "scikit-learn>=1.9.0",
    "m2dp>=0.1.2",
    "faiss-cpu>=1.15.0",
    "graphslam>=0.0.17",
]

[tool.hatch.build.targets.wheel]
packages = ["src/vgslam"]
